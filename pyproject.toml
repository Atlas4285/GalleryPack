[project]
name = "gallerypack"
version = "0.1.0"
description = "Interactive manga downloader for E-Hentai and JM with LANraragi metadata"
readme = "README.md"
authors = [
    { name = "Atlas", email = "67567432+Atlas4285@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "curl-cffi>=0.16.3",
    "jmcomic>=2.7.8",
    "pillow>=12.3.0",
    "questionary>=2.1.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
gallerypack = "gallerypack.cli:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]
